databases:
  - name: hosp-rec-db
    plan: free

services:
  - type: web
    name: hospital-recommendation-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn hos_rec_sys.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hosp-rec-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.11.9
